<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d28" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="#32344a" stroke-width="2.5" />

  <!-- Atmospheric Aura -->
  <circle cx="64" cy="64" r="44" fill="url(#glowGrad)" />

  <!-- Botanical Reflection Emblem (The Sprout & Speech Silhouette) -->
  <g filter="url(#softGlow)">
    <!-- Primary Sprout Leaf -->
    <path
      d="M64 24 C64 24, 94 42, 94 74 C94 94, 78 106, 60 106 C42 106, 32 94, 35 78 C38 62, 52 50, 61 42 C63 39, 64 33, 64 24 Z"
      fill="url(#leafGrad)"
    />

    <!-- Secondary Complementary Petal / Gentle Echo -->
    <path
      d="M62 46 C62 46, 42 56, 40 76 C39 84, 43 93, 49 98 C46 92, 45 84, 48 76 C51 68, 59 58, 62 46 Z"
      fill="#fde68a"
      opacity="0.45"
    />

    <!-- Leaf Vein & Breath Curve -->
    <path
      d="M52 98 C55 86, 61 70, 72 52"
      fill="none"
      stroke="url(#stemGrad)"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.9"
    />

    <!-- Thought Spark / Clarity Star -->
    <path
      d="M91 32 C91 36, 95 38, 99 38 C95 38, 91 40, 91 44 C91 40, 87 38, 83 38 C87 38, 91 36, 91 32 Z"
      fill="url(#sparkleGrad)"
    />
    <circle cx="91" cy="38" r="1.5" fill="#ffffff" />
  </g>
</svg>